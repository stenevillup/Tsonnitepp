[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/tsonnitepp", "apps/tsonnitepp-cli", "xtask"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/stenevillup/tsonnitepp"

[workspace.dependencies]
# internal
tsonnitepp-geom = { path = "crates/geom" }
tsonnitepp-color = { path = "crates/color" }
tsonnitepp-doc = { path = "crates/doc" }
tsonnitepp-pathops = { path = "crates/pathops" }
tsonnitepp-brush = { path = "crates/brush" }
tsonnitepp-trace = { path = "crates/trace" }
tsonnitepp-text = { path = "crates/text" }
tsonnitepp-effects = { path = "crates/effects" }
tsonnitepp-render = { path = "crates/render" }
tsonnitepp-svg = { path = "crates/svg" }
tsonnitepp-pdf = { path = "crates/pdf" }
tsonnitepp-format = { path = "crates/format" }
tsonnitepp-tools = { path = "crates/tools" }
tsonnitepp-engine = { path = "crates/engine" }
tsonnitepp-ui-egui = { path = "crates/ui-egui" }
tsonnitepp-mcp = { path = "crates/mcp" }
tsonnitepp-testkit = { path = "crates/testkit" }
tsonnitepp-cad = { path = "crates/cad" }
tsonnitepp-eps = { path = "crates/eps" }
tsonnitepp-metafile = { path = "crates/metafile" }
tsonnitepp-plugins = { path = "crates/plugins" }

# foundation
kurbo = { version = "0.13", features = ["serde"] }
peniko = "0.6"
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
proptest = "1"
# tests: a TCP port bound without listening (connections to it are refused)
socket2 = "0.6"
# Sandboxed WebAssembly plug-ins: a pure-Rust interpreter (MIT OR Apache-2.0) that builds for wasm32
# too. Without `wat` (text parsing is test-only) and memory64; `validate` keeps full module
# validation on; the portable dispatcher can't overflow the host stack on long-running modules.
wasmi = { version = "2.0.0", default-features = false, features = ["std", "validate", "stable", "portable-dispatch"] }
# Tests: WebAssembly text -> binary for the plug-in fixtures (Apache-2.0 WITH LLVM-exception).
wat = "1.228"

# rendering / formats
vello_cpu = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "tiff", "bmp"] }
usvg = "0.48"
krilla = "0.8"
skrifa = "0.47"
harfrust = "0.13"
linesweeper = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
jpeg-encoder = { version = "0.6", default-features = false, features = ["std"] }
gif = { version = "0.14", default-features = false, features = ["std", "raii_no_panic"] }

# ui
egui = "0.36"
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"
arboard = { version = "3.6", default-features = false }
clipboard-win = "5.4"
webbrowser = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
# Tsonnitepp never crashes: shipped code returns `Result`/`Option` instead of panicking (see
# AGENTS.md › Robustness). Tests may unwrap (clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
